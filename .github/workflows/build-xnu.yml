name: build-xnu

# 目标: 在 Linux CI 上做出可跳转的开源 XNU（arm64）。
#
# 两轮探测的结论（2026-10-18）：
#   1) XNU 源码能拉，pexpert/arm64/boot.h 与我们的 boot_args 完全一致
#   2) cctools 需要 libBlocksRuntime（apt: libblocksruntime-dev）
#   3) XNU 自带的 Makefile 需要 macOS 工具链（xcrun / sw_vers / 系统 sysctl），
#      在 Linux 上直接 make 必然失败
#
# 因此改为：借用 alephsecurity/xnu-qemu-arm64 已经解决过这件事的 SDK 与脚本。

on:
  push:
    paths:
      - ".github/workflows/build-xnu.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang lld llvm \
            python3 git curl ca-certificates \
            libssl-dev uuid-dev bison flex libxml2-dev zlib1g-dev \
            autoconf automake libtool libblocksruntime-dev libbsd-dev \
            device-tree-compiler

      - name: 取 xnu-qemu-arm64（含 SDK 与构建脚本）
        run: |
          exec > >(tee -a qemuarm64-fetch.log) 2>&1
          set -x
          git clone --depth 1 https://github.com/alephsecurity/xnu-qemu-arm64.git || true
          ls xnu-qemu-arm64 | head -40
          echo "=== 顶层脚本 ==="
          ls -l xnu-qemu-arm64/*.sh 2>/dev/null || true
          echo "=== build.sh 内容 ==="
          for f in xnu-qemu-arm64/build.sh xnu-qemu-arm64/build-linux.sh xnu-qemu-arm64/scripts/*.sh; do
            if [ -f "$f" ]; then echo "--- $f ---"; sed -n '1,60p' "$f"; fi
          done
          echo "=== 是否有 sdk 目录 ==="
          find xnu-qemu-arm64 -maxdepth 2 -iname "*sdk*" 2>/dev/null | head -10
          echo "=== README 前 60 行 ==="
          sed -n '1,60p' xnu-qemu-arm64/README.md 2>/dev/null || true

      - name: 取 cctools-port 并构建（这次装了 libBlocksRuntime）
        run: |
          exec > >(tee -a cctools-build.log) 2>&1
          set -x
          git clone --depth 1 https://github.com/tpoechtrager/cctools-port.git || true
          cd cctools-port/cctools
          ./autogen.sh || true
          ./configure --prefix=/opt/cctools --target=aarch64-apple-darwin || true
          make -j"$(nproc)" || true
          sudo make install || true
          ls -l /opt/cctools/bin || true
          /opt/cctools/bin/ld64 -v || true

      - name: 尝试按 xnu-qemu-arm64 的方式构建
        run: |
          exec > >(tee -a xnu-build.log) 2>&1
          set -x
          export PATH=/opt/cctools/bin:$PATH
          cd xnu-qemu-arm64 || exit 0
          if [ -f build.sh ]; then
            echo "=== 运行 build.sh ==="
            chmod +x build.sh || true
            ./build.sh || true
          fi
          echo "=== 产出物查找 ==="
          find . -maxdepth 3 -name "*.bin" -o -maxdepth 3 -name "kernel*" -o -maxdepth 3 -name "*.img" 2>/dev/null | head -20

      - name: 汇总
        if: always()
        run: |
          exec > >(tee -a summary.txt) 2>&1
          echo "### date: $(date -u)"
          for f in qemuarm64-fetch.log cctools-build.log xnu-build.log; do
            echo
            echo "########## $f ##########"
            if [ -f "$f" ]; then
              echo "--- 行数: $(wc -l < "$f") ---"
              tail -100 "$f"
            else
              echo "(没有该文件)"
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-logs-${{ github.run_number }}
          path: |
            qemuarm64-fetch.log
            cctools-build.log
            xnu-build.log
            summary.txt
          if-no-files-found: warn
