name: build-xnu

# 用 blacktop/darwin-xnu-build 构建开源 XNU，并打上 fuxi 板级补丁序列。
#
# 路线参考：dipa-studio/ios-sweet（他们把 xnu-8796 移植到骁龙 732G 并跑起 iOS 16 用户态）。
# 我们把他们的板级标识 SWEET 换成 FUXI，硬件常量按 SM8550 调整。
#
# 产物：kernel.*（Mach-O 内核）+ 构建日志

on:
  push:
    paths:
      - ".github/workflows/build-xnu.yml"
      - "xnu/patches/**"
  workflow_dispatch:
    inputs:
      kernel_config:
        description: "RELEASE / DEVELOPMENT / DEBUG"
        default: "DEVELOPMENT"
      machine_config:
        description: "xnu MACHINE_CONFIG"
        default: "FUXI"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: "13.5"
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'FUXI' }}

jobs:
  build:
    # macos-14 自带 Xcode 15.x，它的 iig 与 xnu-8796 的 IORPC ABI 匹配
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 取构建脚本
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          mkdir -p dxb/patches
          cp xnu/patches/*.patch dxb/patches/
          # libfirehose_kernel 只出 arm64e，而我们的内核是普通 arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: 依赖
        run: |
          brew install jq gum bash cmake ninja || true
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: 构建
        working-directory: dxb
        env:
          MAKEFLAGS: "-k"
        run: |
          set +e
          bash build.sh > ../build.log 2>&1
          echo "退出码: $?"
          tail -60 ../build.log

      - name: 收集产物
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true
          echo "=== 关键错误 ==="
          grep -nE "(^|\s)error:" build.log 2>/dev/null | head -40 || true
          echo "=== 未定义符号 ==="
          grep -n "Undefined symbols" -A 30 build.log 2>/dev/null | head -40 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: |
            out/
            build.log
          if-no-files-found: warn
          retention-days: 14
