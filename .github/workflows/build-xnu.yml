name: build-xnu

# 在 macOS runner 上原生构建开源 XNU（arm64）。
#
# 为什么用 macOS runner：
#   XNU 自带的 Makefile 依赖 xcrun / macOS SDK / macOS 的 sysctl 语义，
#   在 Linux 上模拟这些是无底洞。GitHub Actions 提供 macos-14（自带 Xcode），
#   这是 Apple 官方支持的构建方式。
#
# 产物：BUILD/obj/RELEASE_ARM64 下的 kernel 相关文件 + 完整构建日志

on:
  push:
    paths:
      - ".github/workflows/build-xnu.yml"
      - "scripts/build-xnu-macos.sh"
      - "scripts/inspect-xnu-macos.sh"
  workflow_dispatch:      # 也可以在 Actions 页面手动点 "Run workflow"

jobs:
  build:
    # macos-14 = Apple Silicon(M1)，比 macos-13 快 2-3 倍，池子也更大
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          exec > >(tee -a env.log) 2>&1
          sw_vers
          xcode-select -p
          clang --version || true
          uname -a
          sysctl -n hw.ncpu || true
          df -h /

      - name: 修 Xcode 15+ 缺 availability.pl 的问题
        run: |
          exec > >(tee -a fixup.log) 2>&1
          set -x
          SDK=$(xcrun --sdk macosx --show-sdk-path || true)
          echo "SDK=$SDK"
          if [ -n "$SDK" ]; then
            TARGET="$SDK/usr/local/libexec"
            if [ ! -x "$TARGET/availability.pl" ]; then
              echo "缺少 availability.pl，造一个最小替身"
              sudo mkdir -p "$TARGET"
              printf '#!/usr/bin/env perl\nexit 0;\n' | sudo tee "$TARGET/availability.pl" >/dev/null
              sudo chmod +x "$TARGET/availability.pl"
            fi
            ls -l "$TARGET/availability.pl" || true
          fi
      - name: 取 XNU 源码
        run: |
          exec > >(tee -a fetch.log) 2>&1
          set -x
          git clone --depth 1 --branch xnu-8792.81.2 \
            https://github.com/apple-oss-distributions/xnu.git
          cd xnu
          git log --oneline -1
          ls
          echo "=== boot_args 定义 ==="
          sed -n '/typedef struct boot_args/,/boot_args;/p' pexpert/pexpert/arm64/boot.h

      - name: 去掉 -Werror（Xcode 15 的 clang 比 xnu-8792 当年更严格）
        run: |
          exec > >(tee -a werror.log) 2>&1
          set -x
          cd xnu
          echo "=== -Werror 出现在这些文件里 ==="
          grep -rl -- "-Werror" makedefs bsd iokit osfmk libkern 2>/dev/null | head -20 || true
          for f in $(grep -rl -- "-Werror" makedefs 2>/dev/null); do
            sed -i '' 's/-Werror//g' "$f" 2>/dev/null || sed -i 's/-Werror//g' "$f"
          done
          echo "=== 处理后 ==="
          grep -rn -- "-Werror" makedefs 2>/dev/null | head -10 || echo "(已清空)"
      - name: 构建 XNU（arm64 RELEASE）
        run: |
          exec > >(tee -a build.log) 2>&1
          set -x
          cd xnu
          make -j"$(sysctl -n hw.ncpu)" ARCH_CONFIGS=ARM64 KERNEL_CONFIGS=RELEASE || true
          echo "=== 产出物 ==="
          find BUILD -maxdepth 4 -type f \( -name "kernel*" -o -name "*.t?" -o -name "mach*" \) 2>/dev/null | head -40
          ls -lh BUILD/obj/RELEASE_ARM64/ 2>/dev/null || true

      - name: 诊断缺失的 firehose 头文件
        if: always()
        run: |
          exec > >(tee -a firehose.log) 2>&1
          set -x
          cd xnu
          echo "=== log.c 里用到的 firehose 相关标识 ==="
          grep -n -i "firehose\|os_log" libkern/os/log.c | head -40 || true
          echo "=== subr_log.c 里用到的 ==="
          grep -n -i "firehose" bsd/kern/subr_log.c | head -40 || true
          echo "=== EXTERNAL_HEADERS/os 目录内容 ==="
          ls EXTERNAL_HEADERS/os/ 2>/dev/null | head -30 || echo "(无此目录)"
          echo "=== 树里有没有 firehose 相关文件 ==="
          find . -iname "*firehose*" 2>/dev/null | head -10 || true
          echo "=== SDK 里有没有 ==="
          SDK=$(xcrun --sdk macosx --show-sdk-path || true)
          find "$SDK" -iname "*firehose*" 2>/dev/null | head -10 || echo "(SDK 里没有)"
          echo "=== 头文件搜索路径（看 XNU 期望从哪拿）==="
          grep -rn "EXTERNAL_HEADERS" makedefs/MakeInc.cmd | head -10 || true
      - name: 打包产物
        if: always()
        run: |
          exec > >(tee -a pack.log) 2>&1
          set -x
          mkdir -p out
          if [ -d xnu/BUILD ]; then
            tar -cjf out/xnu-build-artifacts.tar.bz2 -C xnu BUILD 2>/dev/null || true
          fi
          ls -lh out || true

      - name: 汇总
        if: always()
        run: |
          exec > >(tee -a summary.txt) 2>&1
          echo "### date: $(date -u)"
          for f in env.log fetch.log build.log pack.log; do
            echo
            echo "########## $f ##########"
            if [ -f "$f" ]; then
              echo "--- 行数: $(wc -l < "$f") ---"
              tail -120 "$f"
            else
              echo "(没有该文件)"
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-build-${{ github.run_number }}
          path: |
            env.log
            fetch.log
            build.log
            pack.log
            werror.log
            firehose.log
            summary.txt
            out/xnu-build-artifacts.tar.bz2
          if-no-files-found: warn
