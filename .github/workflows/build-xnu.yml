name: build-xnu

# 在 macOS runner 上原生构建开源 XNU（arm64）。
#
# 为什么换 macOS：
#   XNU 自带的 Makefile 依赖 xcrun / macOS SDK / macOS 的 sysctl 语义，
#   在 Linux 上模拟这些是无底洞。GitHub Actions 提供 macos-14（自带 Xcode），
#   这是 Apple 官方支持的构建方式。
#
# 产物：BUILD/obj/RELEASE_ARM64 下的 kernel 相关文件 + 完整构建日志

on:
  push:
    paths:
      - ".github/workflows/build-xnu.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          exec > >(tee -a env.log) 2>&1
          sw_vers
          xcode-select -p
          clang --version || true
          uname -a
          sysctl -n hw.ncpu || true
          df -h /

      - name: 取 XNU 源码
        run: |
          exec > >(tee -a fetch.log) 2>&1
          set -x
          git clone --depth 1 --branch xnu-8792.81.2 \
            https://github.com/apple-oss-distributions/xnu.git
          cd xnu
          git log --oneline -1
          ls
          echo "=== boot_args 定义 ==="
          sed -n '/typedef struct boot_args/,/boot_args;/p' pexpert/pexpert/arm64/boot.h

      - name: 构建 XNU（arm64 RELEASE）
        run: |
          exec > >(tee -a build.log) 2>&1
          set -x
          cd xnu
          make -j"$(sysctl -n hw.ncpu)" ARCH_CONFIGS=ARM64 KERNEL_CONFIGS=RELEASE || true
          echo "=== 产出物 ==="
          find BUILD -maxdepth 4 -type f \( -name "kernel*" -o -name "*.t?" -o -name "mach*" \) 2>/dev/null | head -40
          ls -lh BUILD/obj/RELEASE_ARM64/ 2>/dev/null || true

      - name: 打包产物
        if: always()
        run: |
          exec > >(tee -a pack.log) 2>&1
          set -x
          mkdir -p out
          if [ -d xnu/BUILD ]; then
            tar -cjf out/xnu-build-artifacts.tar.bz2 -C xnu BUILD 2>/dev/null || true
          fi
          ls -lh out || true

      - name: 汇总
        if: always()
        run: |
          exec > >(tee -a summary.txt) 2>&1
          echo "### date: $(date -u)"
          for f in env.log fetch.log build.log pack.log; do
            echo
            echo "########## $f ##########"
            if [ -f "$f" ]; then
              echo "--- 行数: $(wc -l < "$f") ---"
              tail -120 "$f"
            else
              echo "(没有该文件)"
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-build-${{ github.run_number }}
          path: |
            env.log
            fetch.log
            build.log
            pack.log
            summary.txt
            out/xnu-build-artifacts.tar.bz2
          if-no-files-found: warn
