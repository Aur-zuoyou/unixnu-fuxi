name: build-xnu

# 目标: 在 Linux CI 上交叉编译开源 XNU（arm64），拿到可跳转的二进制。
#
# 现状（2026-10-18 第一轮探测结果）:
#   - XNU 源码 xnu-8792.81.2 能拉到（commit 19c3b8c）
#   - pexpert/arm64/boot.h 与我们的 boot_args 完全一致
#   - cctools / XNU 构建步骤没有产出日志 -> 步骤本身失败, 已改用 exec+tee 写法
#
# 本工作流故意不硬失败, 每步都写日志并上传, 便于逐条推进。

on:
  push:
    paths:
      - ".github/workflows/build-xnu.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang lld llvm \
            python3 git curl ca-certificates \
            libssl-dev uuid-dev bison flex libxml2-dev zlib1g-dev \
            autoconf automake libtool

      - name: 取 XNU 源码
        run: |
          exec > >(tee -a xnu-fetch.log) 2>&1
          set -x
          git clone --depth 1 --branch xnu-8792.81.2 \
            https://github.com/apple-oss-distributions/xnu.git || true
          ls xnu | head -40
          echo "=== boot.h 里的 boot_args ==="
          sed -n '/typedef struct boot_args/,/boot_args;/p' xnu/pexpert/pexpert/arm64/boot.h || true
          echo "=== 构建文档 ==="
          ls xnu/doc | head -20 || true
          echo "=== SETUP 文件 ==="
          ls -l xnu/SETUP || true

      - name: 取 cctools-port（Linux 上的 ld64/as）
        run: |
          exec > >(tee -a cctools-fetch.log) 2>&1
          set -x
          git clone --depth 1 https://github.com/tpoechtrager/cctools-port.git || true
          ls cctools-port
          ls cctools-port/cctools | head -30

      - name: 构建 cctools
        run: |
          exec > >(tee -a cctools-build.log) 2>&1
          set -x
          cd cctools-port/cctools
          ./autogen.sh || true
          ./configure --prefix=/opt/cctools --target=aarch64-apple-darwin || true
          make -j"$(nproc)" || true
          sudo make install || true
          ls -l /opt/cctools/bin || true
          /opt/cctools/bin/ld64 -v || true

      - name: 构建 XNU（arm64）
        run: |
          exec > >(tee -a xnu-build.log) 2>&1
          set -x
          export PATH=/opt/cctools/bin:$PATH
          cd xnu
          make -j"$(nproc)" ARCH_CONFIGS=ARM64 KERNEL_CONFIGS=RELEASE || true

      - name: 汇总
        if: always()
        run: |
          exec > >(tee -a summary.txt) 2>&1
          echo "### date: $(date -u)"
          for f in xnu-fetch.log cctools-fetch.log cctools-build.log xnu-build.log; do
            echo
            echo "########## $f ##########"
            if [ -f "$f" ]; then
              echo "--- 行数: $(wc -l < "$f") ---"
              tail -80 "$f"
            else
              echo "(没有该文件)"
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-logs-${{ github.run_number }}
          path: |
            xnu-fetch.log
            cctools-fetch.log
            cctools-build.log
            xnu-build.log
            summary.txt
          if-no-files-found: warn
