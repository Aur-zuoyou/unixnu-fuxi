name: build-xnu

# 在 macOS runner 上原生构建开源 XNU（arm64）。
#
# 已解决的问题:
#   1) Xcode 15 的 SDK 缺少 availability.pl          -> 兜底造一个
#   2) clang 15 把警告当错误（80 处 -Werror）         -> 构建前删掉 -Werror
#   3) 树里缺 libkern/os/firehose_buffer_private.h    -> 用 xnu-stubs 里的替身补齐
#      （其余 firehose 头树内都有，不要动）
#
# 产物: xnu/BUILD 打包 + 全部日志

on:
  push:
    paths:
      - ".github/workflows/build-xnu.yml"
      - "xnu-stubs/**"
      - "scripts/build-xnu-macos.sh"
      - "scripts/inspect-xnu-macos.sh"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          exec > >(tee -a env.log) 2>&1
          sw_vers
          xcode-select -p
          clang --version || true
          sysctl -n hw.ncpu || true

      - name: 抓取 aleph qemu-ios 项目的平台层做法
        if: always()
        run: |
          exec > >(tee -a aleph.log) 2>&1
          set -x
          git clone --depth 1 https://github.com/alephsecurity/xnu-qemu-arm64-tools.git || true
          echo "== 1. 他们的工具仓库结构 =="
          ls -R xnu-qemu-arm64-tools 2>/dev/null | head -60 || true
      - name: 取 XNU 源码
        run: |
          exec > >(tee -a fetch.log) 2>&1
          set -x
          git clone --depth 1 --branch xnu-8792.81.2 https://github.com/apple-oss-distributions/xnu.git
          cd xnu
          git log --oneline -1
          echo "=== 树内 firehose 头 ==="
          find . -name "*.h" -path "*firehose*" 2>/dev/null | head -10

      - name: 造 availability.pl（Xcode 15+ 才有问题）
        run: |
          exec > >(tee -a fixup.log) 2>&1
          set -x
          SDK=$(xcrun --sdk macosx --show-sdk-path || true)
          echo "SDK=$SDK"
          if [ -n "$SDK" ]; then
            TARGET="$SDK/usr/local/libexec"
            if [ ! -x "$TARGET/availability.pl" ]; then
              sudo mkdir -p "$TARGET"
              printf '#!/usr/bin/env perl\nexit 0;\n' | sudo tee "$TARGET/availability.pl" >/dev/null
              sudo chmod +x "$TARGET/availability.pl"
            fi
            ls -l "$TARGET/availability.pl" || true
          fi

      - name: 补上缺失的 firehose_buffer_private.h
        run: |
          exec > >(tee -a shim.log) 2>&1
          set -x
          SRC="$GITHUB_WORKSPACE/xnu-stubs/os/firehose_buffer_private.h"
          ls -l "$SRC"
          # 放到 EXTERNAL_HEADERS/os（在 include path 上，libkern/os 与 bsd/kern 都能找到）
          mkdir -p xnu/EXTERNAL_HEADERS/os
          cp "$SRC" xnu/EXTERNAL_HEADERS/os/firehose_buffer_private.h
          cp "$SRC" xnu/libkern/os/firehose_buffer_private.h
          ls -l xnu/EXTERNAL_HEADERS/os/firehose_buffer_private.h
          head -30 xnu/EXTERNAL_HEADERS/os/firehose_buffer_private.h

      - name: 放开 start.s 的编译条件（消除 __start undefined）
        run: |
          exec > >(tee -a startfix.log) 2>&1
          set -x
          python3 xnu-stubs/patch_files_arm64.py xnu
          echo "== 改后的 start.s 行 =="
          grep -n "arm64/start.s" xnu/osfmk/conf/files.arm64 || echo "(没找到)"

      - name: 给汇编器补 include 路径（start.s 会 include 别的 .s/.h）
        run: |
          exec > >(tee -a asflags.log) 2>&1
          set -x
          cd xnu
          echo "== ASFLAGS 定义在哪里 =="
          grep -rn "ASFLAGS" makedefs/*.def makedefs/*.cmd 2>/dev/null | head -10 || true
          echo "== 在 MakeInc.def 末尾追加 include 路径 =="
          # 用 printf 追加（herdok 结束符不能顶格，会破坏 YAML 块）
          # SOURCE_DIR 在 osfmk 目录下可能已指向 osfmk 本身，所以两个都加
          INCS="-I\$(SOURCE_DIR) -I\$(SOURCE_DIR)/osfmk -I\$(SOURCE_DIR)/arm64 -I\$(OBJROOT) -I\$(OBJROOT)/EXPORT_HDRS"
          for f in makedefs/MakeInc.def makedefs/MakeInc.cmd; do
            if [ -f "$f" ]; then
              printf "\n# fuxi: start.s includes <arm64/tunables/tunables.s>\nASFLAGS += %s\n" "$INCS" >> "$f"
              echo "追加到 $f: $(tail -2 "$f" | tr "\n" " ")"
            fi
          done
          tail -8 makedefs/MakeInc.def

          echo "== 2. 有没有构建 XNU 的脚本 =="
          find xnu-qemu-arm64-tools -name "*.sh" 2>/dev/null | head -20 || true
          echo "== 3. 脚本内容（前 80 行）=="
          for f in $(find xnu-qemu-arm64-tools -name "*.sh" 2>/dev/null | head -3); do
            echo "--- $f ---"
            sed -n "1,80p" "$f"
          done
          echo "== 4. 有没有平台层/patch 文件 =="
          find xnu-qemu-arm64-tools -iname "*patch*" -o -iname "*pexpert*" -o -iname "*platform*" 2>/dev/null | head -20 || true
          echo "== 5. QEMU 仓库里的 XNU 相关 hw 文件 =="
          git clone --depth 1 https://github.com/alephsecurity/xnu-qemu-arm64.git 2>/dev/null || true
          find xnu-qemu-arm64/hw -iname "*xnu*" -o -iname "*apple*" 2>/dev/null | head -20 || true

      - name: 去掉 -Werror（clang 15 比 xnu-8792 当年更严格）
        run: |
          exec > >(tee -a werror.log) 2>&1
          set -x
          cd xnu
          echo "=== 有 -Werror 的文件 ==="
          grep -rl -- "-Werror" makedefs 2>/dev/null | head -20 || true
          for f in $(grep -rl -- "-Werror" makedefs 2>/dev/null); do
            sed -i '' 's/-Werror//g' "$f"
          done
          echo "=== 处理后 ==="
          grep -rn -- "-Werror" makedefs 2>/dev/null | head -5 || echo "(已清空)"

      - name: 造一个空的 libVMAPPLE.os.RELEASE.a（Apple 私有内核支持库）
        run: |
          exec > >(tee -a kernlib.log) 2>&1
          set -x
          # /System 是只读卷（SIP），不能在那里建目录。
          # 改为把构建脚本引用的路径改写到可写位置，并在那里造空库。
          cd xnu
          echo "=== 引用 KernelSupport 的文件 ==="
          grep -rln "KernelSupport" makedefs bsd osfmk libkern iokit pexpert 2>/dev/null | head -10 || true
          for f in $(grep -rl "KernelSupport" makedefs bsd osfmk libkern iokit pexpert 2>/dev/null); do
            sed -i "" "s|/System/Library/KernelSupport|/tmp/kernelsupport|g" "$f"
            echo "改路径: $f"
          done
          mkdir -p /tmp/kernelsupport
          # macOS 的 ar 不接受空库，先编一个空 .o 放进去
          printf "int fuxi_kernelsupport_stub;\n" > /tmp/kernelsupport/stub.c
          clang -c /tmp/kernelsupport/stub.c -o /tmp/kernelsupport/stub.o
          ar rcs /tmp/kernelsupport/libVMAPPLE.os.RELEASE.a /tmp/kernelsupport/stub.o
          ar t /tmp/kernelsupport/libVMAPPLE.os.RELEASE.a
          # 链接器还要 -lfirehose_kernel，放到 SDK 的 kernel 库目录（-L 指向那里）
          SDK=$(xcrun --sdk macosx --show-sdk-path || true)
          KLIB="$SDK/usr/local/lib/kernel"
          sudo mkdir -p "$KLIB"
          sudo cp /tmp/kernelsupport/stub.o "$KLIB/stub.o"
          sudo ar rcs "$KLIB/libfirehose_kernel.a" "$KLIB/stub.o"
          sudo cp /tmp/kernelsupport/libVMAPPLE.os.RELEASE.a "$KLIB/"
          ls -l "$KLIB"
          ls -l /tmp/kernelsupport/
          grep -rn "kernelsupport" makedefs 2>/dev/null | head -5 || true
          cd ..

      - name: 构建 XNU（arm64 RELEASE）
        run: |
          exec > >(tee -a build.log) 2>&1
          set -x
          cd xnu
          # 同时打开 IVMAPPLE 编译标记（双保险：即使 files.arm64 还有条件也能放开）
          make -j"$(sysctl -n hw.ncpu)" ARCH_CONFIGS=ARM64 KERNEL_CONFIGS=RELEASE IVMAPPLE=1 || true
          echo "== 验证 start.o =="
          find BUILD -name "start.o" 2>/dev/null | head -5 || true
          echo "== LDFILELIST 里的 start =="
          for f in $(find BUILD -name "LDFILELIST*" 2>/dev/null | head -3); do grep -i "start.o" "$f" | head -3; done || true
          echo "== 入口符号 =="
          for b in $(find BUILD -name "kernel.release*" -type f 2>/dev/null | head -2); do echo "--- $b ---"; nm "$b" 2>/dev/null | grep -i "__start" | head -3; done || true
          echo "=== 产出物 ==="
          find BUILD -maxdepth 4 -type f \( -name "kernel*" -o -name "*.t?" -o -name "mach*" \) 2>/dev/null | head -40
          ls -lh BUILD/obj/RELEASE_ARM64/ 2>/dev/null || true

      - name: 诊断 config 的 tag 与 arm64 汇编的归属
        if: always()
        run: |
          exec > >(tee -a startup.log) 2>&1
          cd xnu
          echo "== 1. 生成的 Makefile 里有没有 arm64 相关内容 =="
          for f in $(find BUILD -name "Makefile" -path "*osfmk/RELEASE*" 2>/dev/null | head -1); do
            echo "--- $f: 行数 $(wc -l < "$f") ---"
            grep -c "arm64" "$f" || true
            grep -n "arm64/" "$f" | head -10 || true
          done
          echo "== 2. 所有 conf 文件里提到 start.s 的地方 =="
          grep -rn "start\.s" osfmk/conf bsd/conf libsa/conf pexpert/conf iokit/conf 2>/dev/null | head -20 || true
          echo "== 3. files.arm64 前 40 行（看约定）=="
          sed -n "1,40p" osfmk/conf/files.arm64
          echo "== 4. nos_arm_asm 在哪些 conf 里出现 =="
          grep -rln "nos_arm_asm" osfmk/conf bsd/conf libsa/conf pexpert/conf 2>/dev/null | head -10 || true
          grep -rc "nos_arm_asm" osfmk/conf/files.arm64 2>/dev/null || true
          echo "== 5. config 工具本身（看它怎么解析）=="
          ls SETUP/config/ 2>/dev/null | head -10 || true
          grep -n "optional" SETUP/config/mkglue.c 2>/dev/null | head -5 || true

      - name: 打包产物
        if: always()
        run: |
          exec > >(tee -a pack.log) 2>&1
          set -x
          mkdir -p out
          if [ -d xnu/BUILD ]; then
            tar -cjf out/xnu-build-artifacts.tar.bz2 -C xnu BUILD 2>/dev/null || true
          fi
          ls -lh out || true

      - name: 汇总
        if: always()
        run: |
          exec > >(tee -a summary.txt) 2>&1
          echo "### date: $(date -u)"
          for f in env.log fetch.log fixup.log shim.log werror.log build.log pack.log; do
            echo
            echo "########## $f ##########"
            if [ -f "$f" ]; then
              echo "--- 行数: $(wc -l < "$f") ---"
              tail -100 "$f"
            else
              echo "(没有该文件)"
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-build-${{ github.run_number }}
          path: |
            env.log
            fetch.log
            fixup.log
            shim.log
            werror.log
            build.log
            pack.log
            startup.log
            asflags.log
            startfix.log
            aleph.log
            summary.txt
            out/xnu-build-artifacts.tar.bz2
          if-no-files-found: warn
