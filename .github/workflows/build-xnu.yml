name: build-xnu

# 在 macOS runner 上原生构建开源 XNU（arm64）。
#
# 已知问题与对策:
#   1) Xcode 15 的 SDK 缺少 availability.pl      -> 兜底造一个
#   2) clang 15 把警告当错误（80 处 -Werror）     -> 构建前删掉 -Werror
#   3) 4 个 Apple 私有 firehose 头不存在          -> 用 xnu-stubs 里的 shim 替换
#
# 产物: xnu/BUILD 打包 + 全部日志

on:
  push:
    paths:
      - ".github/workflows/build-xnu.yml"
      - "xnu-stubs/**"
      - "scripts/build-xnu-macos.sh"
      - "scripts/inspect-xnu-macos.sh"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          exec > >(tee -a env.log) 2>&1
          sw_vers
          xcode-select -p
          clang --version || true
          sysctl -n hw.ncpu || true

      - name: 取 XNU 源码
        run: |
          exec > >(tee -a fetch.log) 2>&1
          set -x
          git clone --depth 1 --branch xnu-8792.81.2 https://github.com/apple-oss-distributions/xnu.git
          cd xnu
          git log --oneline -1
          sed -n '/typedef struct boot_args/,/boot_args;/p' pexpert/pexpert/arm64/boot.h

      - name: 造 availability.pl（Xcode 15+ 才有问题）
        run: |
          exec > >(tee -a fixup.log) 2>&1
          set -x
          SDK=$(xcrun --sdk macosx --show-sdk-path || true)
          echo "SDK=$SDK"
          if [ -n "$SDK" ]; then
            TARGET="$SDK/usr/local/libexec"
            if [ ! -x "$TARGET/availability.pl" ]; then
              sudo mkdir -p "$TARGET"
              printf '#!/usr/bin/env perl\nexit 0;\n' | sudo tee "$TARGET/availability.pl" >/dev/null
              sudo chmod +x "$TARGET/availability.pl"
            fi
            ls -l "$TARGET/availability.pl" || true
          fi

      - name: 枚举树内真实的 firehose 头文件（只缺 firehose_buffer_private.h）
        run: |
          exec > >(tee -a shim.log) 2>&1
          cd xnu
          echo "########## 1. 树里所有 firehose 相关头 ##########"
          find . -name "*.h" \( -path "*firehose*" -o -name "firehose*" \) 2>/dev/null | grep -v "^./BUILD" | head -20

          echo
          echo "########## 2. tracepoint_private.h 的类型定义区 ##########"
          sed -n '100,200p' libkern/firehose/tracepoint_private.h 2>/dev/null || echo "(不存在)"

          echo
          echo "########## 3. chunk_private.h（前 120 行）##########"
          sed -n '1,120p' libkern/firehose/chunk_private.h 2>/dev/null || echo "(不存在)"

          echo
          echo "########## 4. ioctl_private.h（前 60 行）##########"
          sed -n '1,60p' libkern/firehose/ioctl_private.h 2>/dev/null || echo "(不存在)"

          echo
          echo "########## 5. 代码里用到的 firehose_buffer 相关标识 ##########"
          grep -ohE "\b(firehose_buffer[a-z_0-9]*|__firehose_buffer[a-z_0-9]*|firehose_push_reply[a-z_0-9]*|FIREHOSE_BUFFER[A-Z_0-9]*)\b" \
            libkern/os/log.c bsd/kern/subr_log.c 2>/dev/null | sort -u

          echo
          echo "########## 6. firehose_buffer 的类型在别处有没有定义 ##########"
          grep -rn "firehose_buffer_t\b" --include="*.h" . 2>/dev/null | grep -v "^./BUILD" | head -10
      - name: 去掉 -Werror（clang 15 比 xnu-8792 当年更严格）
        run: |
          exec > >(tee -a werror.log) 2>&1
          set -x
          cd xnu
          echo "=== 有 -Werror 的文件 ==="
          grep -rl -- "-Werror" makedefs 2>/dev/null | head -20 || true
          for f in $(grep -rl -- "-Werror" makedefs 2>/dev/null); do
            sed -i '' 's/-Werror//g' "$f"
          done
          echo "=== 处理后 ==="
          grep -rn -- "-Werror" makedefs 2>/dev/null | head -5 || echo "(已清空)"

      - name: 构建 XNU（arm64 RELEASE）
        run: |
          exec > >(tee -a build.log) 2>&1
          set -x
          cd xnu
          make -j"$(sysctl -n hw.ncpu)" ARCH_CONFIGS=ARM64 KERNEL_CONFIGS=RELEASE || true
          echo "=== 产出物 ==="
          find BUILD -maxdepth 4 -type f \( -name "kernel*" -o -name "*.t?" -o -name "mach*" \) 2>/dev/null | head -40
          ls -lh BUILD/obj/RELEASE_ARM64/ 2>/dev/null || true

      - name: 打包产物
        if: always()
        run: |
          exec > >(tee -a pack.log) 2>&1
          set -x
          mkdir -p out
          if [ -d xnu/BUILD ]; then
            tar -cjf out/xnu-build-artifacts.tar.bz2 -C xnu BUILD 2>/dev/null || true
          fi
          ls -lh out || true

      - name: 汇总
        if: always()
        run: |
          exec > >(tee -a summary.txt) 2>&1
          echo "### date: $(date -u)"
          for f in env.log fetch.log fixup.log shim.log werror.log build.log pack.log; do
            echo
            echo "########## $f ##########"
            if [ -f "$f" ]; then
              echo "--- 行数: $(wc -l < "$f") ---"
              tail -100 "$f"
            else
              echo "(没有该文件)"
            fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-build-${{ github.run_number }}
          path: |
            env.log
            fetch.log
            fixup.log
            shim.log
            werror.log
            build.log
            pack.log
            summary.txt
            out/xnu-build-artifacts.tar.bz2
          if-no-files-found: warn
