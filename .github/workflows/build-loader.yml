name: build-loader

# 目的: 本机没有任何 aarch64 工具链(已验证), 所以用 GitHub 的机器编。
# 推上去 → Actions 跑 → 从 Artifacts 下载 FuxiLoader.efi。
#
# 注意: 这份 workflow 没有在本地验证过(本地无法跑 GitHub Actions),
# 如果某一步失败, 大概率是 apt 包名或 edk2 tag 变了, 按报错改即可。

on:
  push:
    paths:
      - "loader/**"
      - ".github/workflows/build-loader.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential uuid-dev nasm python3 acpica-tools \
            gcc-aarch64-linux-gnu

      - name: 拉 edk2
        run: |
          git clone --depth 1 --branch edk2-stable202408 https://github.com/tianocore/edk2.git
          cd edk2
          git submodule update --init --depth 1 -- \
            MdePkg/Library/BaseLib/BaseLib.inf 2>/dev/null || true
          git submodule update --init --depth 1

      - name: 编译 FuxiLoader
        run: |
          cd edk2
          source edksetup.sh BaseTools >/dev/null
          export PACKAGES_PATH="$PWD:$GITHUB_WORKSPACE"
          sed -i 's|^GCC5_AARCH64_PREFIX.*|GCC5_AARCH64_PREFIX = aarch64-linux-gnu-|' Conf/toolchain.txt
          build -p "$GITHUB_WORKSPACE/loader/FuxiLoader.dsc" -a AARCH64 -t GCC5 -b RELEASE

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: FuxiLoader-efi
          path: edk2/Build/FuxiLoader/RELEASE_GCC5/AARCH64/FuxiLoader.efi
          if-no-files-found: error
