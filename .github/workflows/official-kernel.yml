name: official-kernel

# 按 UniXNU 官方教程编译 fuxi 内核：
#   ./unixnu defconfig fuxi_defconfig
#   ./unixnu fetch
#   ./unixnu build kernel
#
# 驱动仓库：UniXNU/UniXNU（官方框架）
# 设备仓库：hanzi123-bilp/unixnu-fuxi（官方设备页指定的 fuxi 端口）
# 日志无论成败都推到 ci-logs 分支，方便本地读取。

on:
  push:
    paths:
      - ".github/workflows/official-kernel.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-kernel-${{ github.ref }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  DEFCONFIG: fuxi_defconfig

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      UNIXNU_DEVICE: ${{ github.workspace }}/device
    steps:
      - name: 取本仓库（日志推回用）
        uses: actions/checkout@v4
        with:
          path: ourrepo

      - name: 取 UniXNU（官方框架）
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: unixnu
          persist-credentials: false

      - name: 取设备仓库（官方 fuxi 端口）
        uses: actions/checkout@v4
        with:
          repository: hanzi123-bilp/unixnu-fuxi
          path: device
          persist-credentials: false

      - name: 装依赖
        run: |
          brew install llvm lld mtools dtc unifdef || true
          if ! command -v unifdef >/dev/null; then
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: 报告工具链
        run: |
          sw_vers
          uname -m
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-version || true
          xcrun --sdk iphoneos --find mig || true
          for t in git make clang cmake ninja unifdef ld.lld mformat mcopy dtc; do
            printf '%-10s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done

      - name: 选择设备
        working-directory: unixnu
        run: ./unixnu defconfig "$DEFCONFIG"

      - name: 拉源码
        working-directory: unixnu
        run: ./unixnu fetch

      - name: 给 prepare-xnu-source.py 加 token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          F=unixnu/out/fuxi/tree/scripts/prepare-xnu-source.py
          ls -l "$F" || exit 0
          python3 - "$F" <<'PY'
          import io, sys, os
          p = sys.argv[1]
          t = io.open(p, encoding='utf-8').read()
          if 'GITHUB_TOKEN' in t:
              print('already patched'); raise SystemExit(0)
          old = 'with urllib.request.urlopen(request, timeout=30) as response:'
          new = ('_tok = os.environ.get("GITHUB_TOKEN") or ""\n'
                 '    if _tok:\n'
                 '        request.add_header("Authorization", "Bearer " + _tok)\n'
                 '    request.add_header("User-Agent", "unixnu-build")\n'
                 '    with urllib.request.urlopen(request, timeout=30) as response:')
          if old not in t:
              print('ANCHOR NOT FOUND'); raise SystemExit(1)
          t = t.replace(old, new, 1)
          io.open(p, 'w', encoding='utf-8').write(t)
          print('patched')
          PY

      - name: 编内核
        working-directory: unixnu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          ./unixnu build kernel 2>&1 | tee /tmp/build-kernel.log

      - name: 列出产物
        if: always()
        working-directory: unixnu
        run: |
          echo "===== 产物 ====="
          find . -maxdepth 7 \( -name 'mach.*' -o -name 'kernel.*' -o -name '*.cpo.json' \) 2>/dev/null | head -40
          ls -la build 2>/dev/null | head -20

      - name: 上传内核
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-kernel-unixnu
          path: |
            unixnu/build/**
            /tmp/build-kernel.log
          if-no-files-found: warn
          retention-days: 14

      - name: 把日志推到 ci-logs
        if: always()
        working-directory: ourrepo
        run: |
          set +e
          mkdir -p ci-logs-official
          cp /tmp/build-kernel.log ci-logs-official/build-kernel.log 2>/dev/null
          # unixnu 把详细日志写在自己的目录里，一并带走
          mkdir -p ci-logs-official/unixnu-logs
          cp -r ../unixnu/out/fuxi/logs/. ci-logs-official/unixnu-logs/ 2>/dev/null || true
          ls -la ci-logs-official/unixnu-logs 2>/dev/null | head -10
          {
            echo "===== unixnu/build ====="
            ls -la ../unixnu/build 2>/dev/null | head -25
            echo
            echo "===== 日志尾部 150 行 ====="
            for f in ../unixnu/out/fuxi/logs/*.log; do echo "=== $f ==="; tail -80 "$f"; done 2>/dev/null || tail -150 /tmp/build-kernel.log
          } > ci-logs-official/tail.txt
          git config user.name "xnu-bot"
          git config user.email "xnu-bot@users.noreply.github.com"
          git checkout -f --orphan official-logs-tmp
          git add -f ci-logs-official
          git commit -qm "unixnu fuxi kernel log" || true
          git push -f origin HEAD:ci-logs
