name: build-xnu-macos

# 用 UniXNU 官方方法在 macOS runner 上编 XNU 内核。
#
# 官方流程（UniXNU-sheng/README.md）：
#   ./unixnu build kernel   →  内部调用 scripts/build-xnu-4k-baseline.sh
# 该脚本需要 Xcode 的 iPhoneOS SDK 和 ditto，只能在 macOS 上跑。
#
# 这里直接调用脚本本身，跳过 unixnu 驱动的 fetch/ipsw 步骤（那些需要在本地
# 准备好 IPSW 和 device repo），把等价的环境变量手工备齐。
#
# 产物：build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf

on:
  push:
    paths:
      - ".github/workflows/build-xnu-macos.yml"
      - "vendor/UniXNU-full.tar.gz"
  workflow_dispatch:
    inputs:
      xnu_tag:
        description: "XNU tag（默认官方 10063 = iOS 17）"
        required: false
        default: "xnu-10063.141.1"
      xnu_commit:
        description: "XNU commit（与 tag 对应）"
        required: false
        default: "d8b80295118ef25ac3a784134bcf95cd8e88109f"
      xnu_darwin:
        description: "Darwin 版本"
        required: false
        default: "23.6.0"
      xnu_version:
        description: "XNU 版本号"
        required: false
        default: "10063.141.1"

concurrency:
  group: xnu-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: 取本仓库（vendor/ 里的 UniXNU 源码包）
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            vendor
          sparse-checkout-cone-mode: false

      - name: 环境信息
        run: |
          set -eux
          sw_vers
          xcode-select -p
          xcodebuild -version || true
          clang --version | head -2
          sysctl -n hw.ncpu
          echo "runner: $RUNNER_OS $RUNNER_ARCH"

      - name: 解包 UniXNU 完整源码
        run: |
          set -eux
          tar -xzf vendor/UniXNU-full.tar.gz -C .
          ls UniXNU
          test -f UniXNU/scripts/build-xnu-4k-baseline.sh
          test -f UniXNU/patches/xnu/native-4k-user-abi.patch
          test -f UniXNU/kits/NativePrelink/emit_prelink.py
          echo "补丁数: $(ls UniXNU/patches/xnu/*.patch | wc -l)"

      - name: 装构建依赖
        run: |
          set -eux
          brew install cmake ninja unifdef || true
          for t in git make clang cmake ninja unifdef python3 ditto; do
            command -v "$t" || { echo "缺少 $t"; exit 1; }
          done

      # Xcode 15+ 的 SDK 没有 availability.pl，xnu 的 makefile 会因此失败。
      # 官方 build_uefi.py 也处理这个问题；这里造一个最小替身。
      - name: 准备 availability.pl
        run: |
          set -eux
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          AVA="$SDK/usr/local/libexec/availability.pl"
          if [ ! -x "$AVA" ]; then
            echo "SDK 里没有 availability.pl，造替身"
            mkdir -p "$(dirname "$AVA")" 2>/dev/null || true
            printf '#!/usr/bin/env perl\nexit 0;\n' > "$AVA" 2>/dev/null || {
              echo "无法写入 SDK，改用 fake root"
              mkdir -p "$RUNNER_TEMP/fakeroot/usr/local/bin"
              printf '#!/usr/bin/env perl\nexit 0;\n' > "$RUNNER_TEMP/fakeroot/usr/local/bin/availability.pl"
              chmod +x "$RUNNER_TEMP/fakeroot/usr/local/bin/availability.pl"
            }
            chmod +x "$AVA" 2>/dev/null || true
          fi
          echo "availability.pl 检查完成"

      - name: 概要（源码版本与补丁）
        run: |
          set -eux
          echo "XNU_TAG=${{ github.event.inputs.xnu_tag || 'xnu-10063.141.1' }}"
          echo "XNU_COMMIT=${{ github.event.inputs.xnu_commit || 'd8b80295118ef25ac3a784134bcf95cd8e88109f' }}"
          echo "XNU_DARWIN=${{ github.event.inputs.xnu_darwin || '23.6.0' }}"
          echo "XNU_VERSION=${{ github.event.inputs.xnu_version || '10063.141.1' }}"
          echo "--- 补丁清单 ---"
          ls UniXNU/patches/xnu/ | head -60

      - name: 编 XNU（官方 build-xnu-4k-baseline.sh）
        env:
          UNIXNU_XNU_TAG: ${{ github.event.inputs.xnu_tag || 'xnu-10063.141.1' }}
          UNIXNU_XNU_COMMIT: ${{ github.event.inputs.xnu_commit || 'd8b80295118ef25ac3a784134bcf95cd8e88109f' }}
          UNIXNU_XNU_DARWIN: ${{ github.event.inputs.xnu_darwin || '23.6.0' }}
          UNIXNU_XNU_VERSION: ${{ github.event.inputs.xnu_version || '10063.141.1' }}
          JOBS: "6"
          # 完整照抄 UniXNU-sheng/configs/sheng_defconfig 的 CONFIG_XNU_*。
          # CONFIG_XNU_<NAME>=y 对应 XNU_<NAME>=1。
          #
          # 教训一：offline-component-load-probes.patch 里 native_legacy_display_probe()
          #   有一处调用没有 #if 保护，所以 NATIVE_LEGACY_DISPLAY 必须为 1，
          #   否则链接期 "Undefined symbols: _native_legacy_display_probe"。
          # 教训二：build-xnu-4k-baseline.sh L122 要求 ARMCPU=1 时必须
          #   SOURCE_CORECRYPTO14=1 且（ARMVIRT_PLATFORM=1 或 ARM_DT_PLATFORM=1），
          #   漏掉 ARM_DT_PLATFORM 会让脚本直接 exit 1 而日志里看不到错误。
          XNU_SOURCE_CORECRYPTO14: "1"      # CONFIG_XNU_SOURCE_CORECRYPTO14=y
          XNU_SOURCE_PTHREAD: "1"           # CONFIG_XNU_SOURCE_PTHREAD=y
          XNU_ARM_DT_PLATFORM: "1"          # CONFIG_XNU_ARM_DT_PLATFORM=y
          XNU_ARMCPU: "1"                   # CONFIG_XNU_ARMCPU=y
          XNU_NATIVE_UFS: "1"               # CONFIG_XNU_NATIVE_UFS=y
          XNU_NATIVE_AES: "1"               # CONFIG_XNU_NATIVE_AES=y
          XNU_NATIVE_VIRTIO_BLOCK: "1"      # CONFIG_XNU_NATIVE_VIRTIO_BLOCK=y
          XNU_NATIVE_RAM_BLOCK: "1"         # CONFIG_XNU_NATIVE_RAM_BLOCK=y
          XNU_TRUST_CACHE_RUNTIME: "1"      # CONFIG_XNU_TRUST_CACHE_RUNTIME=y
          XNU_SOURCE_MOCKFS: "1"            # CONFIG_XNU_SOURCE_MOCKFS=y
          XNU_NATIVE_CS_HASH_CACHE: "1"     # CONFIG_XNU_NATIVE_CS_HASH_CACHE=y
          XNU_VERIFIED_ROOT_PROBE: "1"      # CONFIG_XNU_VERIFIED_ROOT_PROBE=y
          XNU_OWNER_ROOT_AUDIT: "1"         # CONFIG_XNU_OWNER_ROOT_AUDIT=y
          XNU_OWNER_ROOT_TRUST: "1"         # CONFIG_XNU_OWNER_ROOT_TRUST=y
          XNU_SHENG_PMGR: "1"               # CONFIG_XNU_SHENG_PMGR=y
          XNU_OWNER_CACHE_MOUNT: "1"        # CONFIG_XNU_OWNER_CACHE_MOUNT=y
          XNU_OWNER_CACHE_STARTUP: "1"      # CONFIG_XNU_OWNER_CACHE_STARTUP=y
          XNU_OWNER_BOOT_MANIFEST: "1"      # CONFIG_XNU_OWNER_BOOT_MANIFEST=y
          XNU_OWNER_DATA_MOUNT: "1"         # CONFIG_XNU_OWNER_DATA_MOUNT=y
          XNU_OWNER_UNION_SYSTEMOS: "1"     # CONFIG_XNU_OWNER_UNION_SYSTEMOS=y
          XNU_DT_PANIC_REGION: "1"          # CONFIG_XNU_DT_PANIC_REGION=y
          XNU_ZONE_PGZ_ALIGNMENT_PROBE: "1" # CONFIG_XNU_ZONE_PGZ_ALIGNMENT_PROBE=y
          XNU_NATIVE_ARCH_TIMER: "1"        # CONFIG_XNU_NATIVE_ARCH_TIMER=y
          XNU_NATIVE_PAN: "1"               # CONFIG_XNU_NATIVE_PAN=y
          XNU_BOOT_PROGRESS: "1"            # CONFIG_XNU_BOOT_PROGRESS=y
          XNU_NATIVE_LEGACY_DISPLAY: "1"    # CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y
          XNU_NATIVE_ADRENO: "1"            # CONFIG_XNU_NATIVE_ADRENO=y
          # n 的几项
          XNU_NATIVE_MOBILE_DISPLAY: "0"    # CONFIG_XNU_NATIVE_MOBILE_DISPLAY=n
          XNU_ARMVIRT_PLATFORM: "0"         # CONFIG_XNU_ARMVIRT_PLATFORM=n
          XNU_SMMU4K_PROBE: "0"
          XNU_BUILD_WERROR: "0"
          # 只在 config 里出现的字符串项
          XNU_CRYPTO_BOOTSTRAP: "prelinked"
          XNU_OWNER_DATA_VOLUME_UUID: "18AB5557-DC2D-469B-8758-855E60F5B0DF"
          XNU_NATIVE_VIRTIO_BLOCK_ARCHIVE: "{tree}/build/native-virtio-block-verified-bundle/libNativeVirtioBlock.a"
          XNU_VERIFIED_ROOT_ARCHIVE: "{tree}/build/verified-root-os-xnu-bundle/libVerifiedRootProbe.a"
          XNU_EXTRA_LD_ARCHIVES: ""
        run: |
          set -euo pipefail
          cd UniXNU
          # 保留完整 trace：脚本内部有若干 `exit 1` 前置检查，失败时只打印
          # 一行说明甚至什么都不打印，普通日志看不出停在哪一步。
          PS4='+ [$LINENO] '
          bash -x scripts/build-xnu-4k-baseline.sh > build-xnu-trace.log 2>&1
          rc=$?
          echo "---- 退出码 $rc ----"
          # 把 trace 的尾部也打出来，方便直接看
          echo "===== trace 尾部 200 行 ====="
          tail -200 build-xnu-trace.log
          # build-xnu.log 是脚本内部 tee 的产物
          [ -f build-xnu.log ] && cp build-xnu.log build-xnu-tail.log || true
          exit $rc

      - name: 列出产物
        if: always()
        run: |
          set -eux
          cd UniXNU
          echo "=== build/xnu 下的内核 ==="
          find build -type f \( -name "mach.*" -o -name "kernel*" \) 2>/dev/null | head -40 || true
          echo "=== ios-obj 目录 ==="
          ls -la build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/ 2>/dev/null | head -40 || true

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-macos-${{ github.run_number }}
          path: |
            UniXNU/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf
            UniXNU/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped
            UniXNU/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
            UniXNU/build-xnu.log
            UniXNU/build-xnu-trace.log
            UniXNU/build/xnu/ios-sym/**/*.dSYM/**
          if-no-files-found: warn
          retention-days: 14

      - name: 上传日志（失败时也保留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-macos-log-${{ github.run_number }}
          path: |
            UniXNU/build-xnu.log
            UniXNU/build-xnu-trace.log
          if-no-files-found: warn
          retention-days: 7
