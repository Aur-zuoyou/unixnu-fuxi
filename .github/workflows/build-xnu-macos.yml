name: build-xnu-macos

# 用 UniXNU 官方方法在 macOS runner 上编 XNU 内核。
#
# 官方流程（docs/guide/build-kernel.md「Build sequence」）：
#   1. unixnu fetch                     克隆 XNU 与 Apple 参考源
#   2. unixnu build kernel              打补丁、编 XNU（此时还没有那些 lib*.a）
#   3. 构建设备 archive                  用第 2 步留下的 .cpo.json 编译每个 .a
#   4. unixnu build kernel              第二次，链接 archive
#   5. unixnu build prelink             产出 kernel.macho
#
# 关键：lib*.a 的源码在 UniXNU/drivers/，构建脚本在
# UniXNU-sheng/scripts/build-arm-driver.py（文档说 "The device repository
# owns the scripts that produce its archives"），所以要把设备仓库的
# scripts/ 叠加到 UniXNU 树上运行。

on:
  push:
    paths:
      - ".github/workflows/build-xnu-macos.yml"
      - "vendor/UniXNU-full.tar.gz"
      - "vendor/UniXNU-sheng-full.tar.gz"
  workflow_dispatch:
    inputs:
      xnu_tag:
        description: "XNU tag（默认官方 10063 = iOS 17）"
        required: false
        default: "xnu-10063.141.1"
      xnu_commit:
        description: "XNU commit"
        required: false
        default: "d8b80295118ef25ac3a784134bcf95cd8e88109f"
      xnu_darwin:
        description: "Darwin 版本"
        required: false
        default: "23.6.0"
      xnu_version:
        description: "XNU 版本号"
        required: false
        default: "10063.141.1"

concurrency:
  group: xnu-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300

    steps:
      - name: 取本仓库
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            vendor
          sparse-checkout-cone-mode: false

      - name: 环境信息
        run: |
          set -eux
          sw_vers
          xcode-select -p
          xcodebuild -version || true
          sysctl -n hw.ncpu

      - name: 组装源码树
        run: |
          set -euxo pipefail
          echo "PWD=$(pwd)"
          echo "--- 根目录 ---"
          ls -la
          echo "--- vendor ---"
          ls -la vendor/ || { echo "没有 vendor 目录"; exit 1; }
          tar -xzf vendor/UniXNU-full.tar.gz -C .
          ls UniXNU/ || { echo "UniXNU 解包失败"; exit 1; }
          mkdir -p _sheng
          tar -xzf vendor/UniXNU-sheng-full.tar.gz -C _sheng
          SHENG=_sheng/UniXNU-sheng

          # build-arm-driver.py 里 ROOT = scripts/../ 即 UniXNU 根，
          # 它读 ROOT/drivers/<comp>/<comp>.cpp 和
          # ROOT/build/xnu/.../*.cpo.json。所以把设备仓库 scripts 叠进去。
          cp -a "$SHENG/scripts/." UniXNU/scripts/

          test -f UniXNU/scripts/build-xnu-4k-baseline.sh
          test -f UniXNU/scripts/build-arm-driver.py
          test -f UniXNU/drivers/NativeUfs/NativeUfs.cpp
          echo "补丁数: $(ls UniXNU/patches/xnu/*.patch | wc -l)"

      - name: 装依赖
        run: |
          set -euxo pipefail
          brew install cmake ninja unifdef || true
          echo "--- 逐个确认工具 ---"
          for t in git make clang cmake ninja unifdef python3 ditto xcrun; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "OK   $t"
            else
              echo "MISS $t"
            fi
          done

      - name: 准备 availability.pl
        run: |
          set -uo pipefail
          SDK="$(xcrun --sdk macosx --show-sdk-path 2>/dev/null || true)"
          echo "SDK=$SDK"
          if [ -n "$SDK" ]; then
            AVA="$SDK/usr/local/libexec/availability.pl"
            if [ ! -x "$AVA" ]; then
              mkdir -p "$(dirname "$AVA")" 2>/dev/null || echo "(SDK 只读)"
              printf '#!/usr/bin/env perl\nexit 0;\n' > "$AVA" 2>/dev/null || echo "(无法写入 SDK)"
              chmod +x "$AVA" 2>/dev/null || true
            fi
            echo "availability.pl: $AVA"
          fi
          echo "此步不阻塞后续"

      - name: 第 1 步 - 编 XNU 基线（产出 cpo.json）
        env:
          UNIXNU_XNU_TAG: ${{ github.event.inputs.xnu_tag || 'xnu-10063.141.1' }}
          UNIXNU_XNU_COMMIT: ${{ github.event.inputs.xnu_commit || 'd8b80295118ef25ac3a784134bcf95cd8e88109f' }}
          UNIXNU_XNU_DARWIN: ${{ github.event.inputs.xnu_darwin || '23.6.0' }}
          UNIXNU_XNU_VERSION: ${{ github.event.inputs.xnu_version || '10063.141.1' }}
          JOBS: "6"
          XNU_SOURCE_CORECRYPTO14: "0"
          XNU_SOURCE_PTHREAD: "0"
          XNU_ARM_DT_PLATFORM: "0"
          XNU_ARMVIRT_PLATFORM: "0"
          XNU_ARMCPU: "0"
          XNU_NATIVE_UFS: "0"
          XNU_NATIVE_AES: "0"
          XNU_NATIVE_VIRTIO_BLOCK: "0"
          XNU_NATIVE_RAM_BLOCK: "0"
          XNU_NATIVE_VIRTIO_CONSOLE: "0"
          XNU_NATIVE_MOBILE_DISPLAY: "0"
          XNU_NATIVE_LEGACY_DISPLAY: "0"
          XNU_NATIVE_ADRENO: "0"
          XNU_NATIVE_OFFLINE_GPU: "0"
          XNU_VERIFIED_ROOT_PROBE: "0"
          XNU_OWNER_ROOT_AUDIT: "0"
          XNU_OWNER_ROOT_TRUST: "0"
          XNU_SHENG_PMGR: "0"
          XNU_SOURCE_MOCKFS: "0"
          XNU_BOOT_PROGRESS: "0"
          XNU_SMMU4K_PROBE: "0"
          XNU_ADRENO_FIRMWARE_PROBE: "0"
          XNU_ADRENO_PM4_PROBE: "0"
          XNU_CONSTANT_UPLOADS_PROBE: "0"
          XNU_NATIVE_CS_HASH_CACHE: "1"
          XNU_NATIVE_ARCH_TIMER: "1"
          XNU_NATIVE_PAN: "1"
          XNU_DT_PANIC_REGION: "1"
          XNU_TRUST_CACHE_RUNTIME: "1"
          XNU_ZONE_PGZ_ALIGNMENT_PROBE: "1"
          XNU_CRYPTO_BOOTSTRAP: "prelinked"
          XNU_BUILD_WERROR: "0"
        run: |
          set -euo pipefail
          cd UniXNU
          PS4='+ [$LINENO] '
          if ! bash -x scripts/build-xnu-4k-baseline.sh > step1.log 2>&1; then
            rc=$?
            echo "===== 第 1 步失败，trace 尾部 ====="
            tail -150 step1.log
            cp step1.log "$GITHUB_WORKSPACE/step1.log"
            exit $rc
          fi
          cp step1.log "$GITHUB_WORKSPACE/step1.log"
          echo "第 1 步成功"
          ls build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/ | head -20
          find build/xnu/ios-obj -name "*.cpo.json" | head -5

      # ── 第 2 步：用设备仓库脚本编出 lib*.a ────────────────────
      - name: 第 2 步 - 编设备 archive
        run: |
          set -uo pipefail
          cd UniXNU
          COMPS=(ArmDTPlatform ArmCpu NativeUfs NativeAES NativeVirtioBlock \
                 NativeRamBlock NativeVirtioConsole NativeLegacyDisplay \
                 NativeMobileDisplay NativeAdreno)
          ok=""; bad=""
          for c in "${COMPS[@]}"; do
            echo "===== build-arm-driver.py $c ====="
            if python3 scripts/build-arm-driver.py "$c" > "step2-$c.log" 2>&1; then
              echo "OK   $c"; ok="$ok $c"
            else
              echo "FAIL $c"; tail -25 "step2-$c.log" || true; bad="$bad $c"
            fi
            cp "step2-$c.log" "$GITHUB_WORKSPACE/" 2>/dev/null || true
          done
          echo "---- 汇总 ----"
          echo "成功:$ok"
          echo "失败:${bad:- 无}"
          echo "---- build/ 下的 .a ----"
          find build -name "*.a" | head -40
          [ -n "$ok" ] || { echo "一个 archive 都没编出来"; exit 1; }

      - name: 产物检查
        if: always()
        run: |
          set -eux
          cd UniXNU || exit 0
          echo "=== cpo.json ==="
          find build/xnu/ios-obj -name "IOPlatformExpert.cpo.json" 2>/dev/null | head -3 || true
          echo "=== 内核 ==="
          find build/xnu -name "mach.development.bcm2837*" 2>/dev/null | head -10 || true

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-macos-log-${{ github.run_number }}
          path: |
            step1.log
            step2-*.log
            UniXNU/step1.log
            UniXNU/step2-*.log
          if-no-files-found: warn
          retention-days: 7
