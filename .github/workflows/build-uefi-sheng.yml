name: build-uefi-sheng

# 目标：用 UniXNU 的 uefi-sheng (Mu-Silicium) 编出 SM8550 的 UEFI 固件。
#
# 关键：不走 `build_uefi.py`（它经过 Mu 的 stuart 框架，其中的
# OverrideValidation 插件在 CI 环境下会 normpath(None) 崩溃），
# 而是照抄 UniXNU-sheng/scripts/build-uefi-sheng.sh 的环境变量，
# 直接调用 EDK2 的 `build` 命令。
#
# 同时跳过该脚本里的 check-sheng.py（它要求从 sheng 官方固件提取的厂商
# 二进制，我们拿不到）。SHENG_VENDOR_HW 因此是默认值 0，走通用驱动：
# 面板保持常亮 + SimpleFbDxe 发布 GOP，足以验证引导链路。
#
# 产物：SILICIUM_UEFI.fd

concurrency:
  group: uefi-sheng-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "xnu/uefi/**"
      - ".github/workflows/build-uefi-sheng.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      device:
        description: "要编译的设备（默认 sheng）"
        required: false
        default: "sheng"

permissions:
  contents: read

env:
  UEFI_SRC_KEY: uefi-src-v4

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # ── 缓存整棵源码树（约 5GB），命中后跳过所有克隆 ──
      - name: 恢复源码缓存
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            UniXNU
            UniXNU-sheng
            uefi-sheng
          key: ${{ env.UEFI_SRC_KEY }}-${{ hashFiles('.github/workflows/build-uefi-sheng.yml') }}

      - name: 安装依赖
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            build-essential uuid-dev iasl nasm python3 python3-pip \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            device-tree-compiler git-lfs clang llvm lld curl unzip
          python3 -m pip install --upgrade pip
          python3 -m pip install -r uefi-sheng/pip-requirements.txt || true
          python3 -m pip install coloredlogs || true

      # ── 复刻 build-uefi-sheng.sh 的环境，跳过 check-sheng.py ──
      - name: 下载全部源码（zip 包，不用 git clone）
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          # GitHub 的 zip 包下载比 clone 更快也更可靠（不受 submodule / LFS / 浅克隆限制）
          fetch_zip() {
            local name="$1"; local url="$2"
            for attempt in 1 2 3; do
              rm -rf "$name" "${name}.zip"
              if curl -fsSL --retry 3 --retry-delay 10 -o "${name}.zip" "$url"; then
                unzip -q "${name}.zip" && rm -f "${name}.zip"
                return 0
              fi
              echo "下载 $name 失败（第 $attempt 次），重试…"
              sleep 20
            done
            echo "下载 $name 彻底失败"; return 1
          }

          # 框架（UniXNU）：用仓库自带的 vendor 包，最可靠
          if [ -f vendor/UniXNU.tar.gz ]; then
            echo "使用 vendor/UniXNU.tar.gz"
            tar -xzf vendor/UniXNU.tar.gz -C .
          else
            echo "没有 vendor 包，下载 zip"
            fetch_zip UniXNU-main https://github.com/UniXNU/UniXNU/archive/refs/heads/main.zip
            mv UniXNU-main UniXNU
          fi
          ls UniXNU/drivers/DarwinBoot/DarwinBootPkg/Driver/DarwinBoot.inf

          # 板级
          fetch_zip UniXNU-sheng-main https://github.com/UniXNU/UniXNU-sheng/archive/refs/heads/main.zip
          mv UniXNU-sheng-main UniXNU-sheng

          # Mu-Silicium 的 SM8550 UEFI 端口（含 shengPkg）
          fetch_zip uefi-sheng-main https://github.com/UniXNU/uefi-sheng/archive/refs/heads/main.zip
          mv uefi-sheng-main uefi-sheng
          # zip 包不含 submodule，逐个下载
          if [ -f uefi-sheng/.gitmodules ]; then
            echo "处理 submodule…"
            python3 - <<'PY'
          import configparser, os, subprocess, sys, urllib.request
          cfg = configparser.ConfigParser()
          cfg.read('uefi-sheng/.gitmodules')
          for sec in cfg.sections():
              path = cfg.get(sec, 'path')
              url = cfg.get(sec, 'url').rstrip('/')
              if url.endswith('.git'):
                  url = url[:-4]
              branch = cfg.get(sec, 'branch', fallback='')
              if branch and '/' in branch:
                  # 形如 release/202608 或 commit hash
                  pass
              target = os.path.join('uefi-sheng', path)
              os.makedirs(os.path.dirname(target) or '.', exist_ok=True)
              import shutil
              shutil.rmtree(target, ignore_errors=True)
              zurl = f'{url}/archive/refs/heads/{branch}.zip' if branch else f'{url}/archive/refs/heads/main.zip'
              print(f'  {path} <- {zurl}')
              tmp = '/tmp/sub.zip'
              try:
                  urllib.request.urlretrieve(zurl, tmp)
              except Exception as e:
                  print(f'  下载失败 {zurl}: {e}')
                  continue
              subprocess.run(['unzip', '-q', tmp, '-d', '/tmp/subx'], check=True)
              roots = os.listdir('/tmp/subx')
              if roots:
                  shutil.move(os.path.join('/tmp/subx', roots[0]), target)
              shutil.rmtree('/tmp/subx', ignore_errors=True)
          PY
          fi
          ls uefi-sheng/Platforms/Xiaomi/shengPkg | head

          # Mu 基座：EDK_TOOLS_PATH 指向 UniXNU/package/Mu_Basecore/BaseTools
          mkdir -p UniXNU/package
          fetch_zip mu_basecore-release-202608 \
            https://github.com/microsoft/mu_basecore/archive/refs/heads/release/202608.zip
          mv mu_basecore-release-202608 UniXNU/package/Mu_Basecore

          du -sh UniXNU UniXNU-sheng uefi-sheng UniXNU/package/Mu_Basecore

      # 缓存命中时也要保证关键路径存在（早期缓存的 key 可能不完整）
      - name: 校验关键路径
        run: |
          set -eux
          # DarwinBoot 是唯一的引导器，必须完整；缺了说明缓存里的 UniXNU 不完整
          DB="$GITHUB_WORKSPACE/UniXNU/drivers/DarwinBoot/DarwinBootPkg/Driver/DarwinBoot.inf"
          if [ ! -f "$DB" ]; then
            echo "UniXNU 不完整（缺 DarwinBoot.inf），强制重新克隆"
            rm -rf "$GITHUB_WORKSPACE/UniXNU"
            for attempt in 1 2 3; do
              git clone --depth 1 https://github.com/UniXNU/UniXNU.git \
                "$GITHUB_WORKSPACE/UniXNU" && break
              echo "重试 $attempt"; sleep 20; rm -rf "$GITHUB_WORKSPACE/UniXNU"
            done
          fi
          ls -l "$DB"
          ls "$GITHUB_WORKSPACE/UniXNU/drivers"

          MU_BASE="$GITHUB_WORKSPACE/UniXNU/package/Mu_Basecore"
          if [ ! -d "$MU_BASE/BaseTools" ]; then
            echo "Mu_Basecore 不在 $MU_BASE，重新克隆"
            rm -rf "$MU_BASE"
            mkdir -p "$(dirname "$MU_BASE")"
            for attempt in 1 2 3; do
              git clone --depth 1 --branch release/202608 \
                https://github.com/microsoft/mu_basecore.git "$MU_BASE" && break
              echo "重试 $attempt"; sleep 20
            done
          fi
          ls "$MU_BASE/BaseTools" | head
          for d in UniXNU UniXNU-sheng uefi-sheng; do
            ls -d "$GITHUB_WORKSPACE/$d" || { echo "缺少 $d"; exit 1; }
          done

      - name: 准备 EDK2 BaseTools 与 Conf
        run: |
          set -eux
          ROOT="$GITHUB_WORKSPACE/UniXNU-sheng"
          UNIXNU_ROOT="$GITHUB_WORKSPACE/UniXNU"
          MU_BASE="$UNIXNU_ROOT/package/Mu_Basecore"

          # uefi-sheng 要放在 UniXNU-sheng/uefi-sheng（脚本就是按这个路径找的）
          if [ ! -d "$ROOT/uefi-sheng" ]; then
            ln -sfn "$GITHUB_WORKSPACE/uefi-sheng" "$ROOT/uefi-sheng"
          fi

          export EDK_TOOLS_PATH="$MU_BASE/BaseTools"
          echo "EDK_TOOLS_PATH=$EDK_TOOLS_PATH"
          ls "$EDK_TOOLS_PATH"

          # 编译 BaseTools（提供 build/GenFw/GenFfs 等）
          make -C "$EDK_TOOLS_PATH" -j"$(nproc)" || true
          ls "$EDK_TOOLS_PATH/Source/C/bin" | head -20

          CONF="$GITHUB_WORKSPACE/.uefi-conf"
          mkdir -p "$CONF"
          for NAME in target tools_def build_rule; do
            [ -f "$CONF/$NAME.txt" ] || cp "$EDK_TOOLS_PATH/Conf/$NAME.template" "$CONF/$NAME.txt"
          done
          ls "$CONF"
          echo "CONF_PATH=$CONF" >> "$GITHUB_ENV"
          echo "EDK_TOOLS_PATH=$EDK_TOOLS_PATH" >> "$GITHUB_ENV"

      - name: 编译 UEFI（直接调用 EDK2 build）
        run: |
          set -eux
          ROOT="$GITHUB_WORKSPACE/UniXNU-sheng"
          UNIXNU_ROOT="$GITHUB_WORKSPACE/UniXNU"
          UES="$ROOT/uefi-sheng"
          MU_BASE="$UNIXNU_ROOT/package/Mu_Basecore"

          export WORKSPACE="$UES"
          export CONF_PATH="$GITHUB_WORKSPACE/.uefi-conf"
          export PYTHON_COMMAND=python3
          export EDK_TOOLS_PATH="$MU_BASE/BaseTools"
          export PATH="$EDK_TOOLS_PATH/BinWrappers/PosixLike:$EDK_TOOLS_PATH/Source/C/bin:$PATH"
          # 注意：必须单行 —— 用反斜杠续行时，缩进空格会被当成路径的一部分
          PP=""
          for d in \
            "$UES" \
            "$UES/Platforms/Xiaomi" \
            "$UNIXNU_ROOT/package" \
            "$UNIXNU_ROOT/drivers/DarwinBoot" \
            "$MU_BASE" \
            "$UES/Common/Mu" \
            "$UES/Common/Mu_OEM_Sample" \
            "$UES/Silicon/Qualcomm" \
            "$UES/Silicon/Silicium" \
            "$UES/Silicium-ACPI" \
            "$UES/Silicium-ACPI/Platforms/Xiaomi" \
            "$UES/Silicium-ACPI/Silicon/Qualcomm"
          do
            PP="${PP:+$PP:}$d"
          done
          export PACKAGES_PATH="$PP"
          echo "PACKAGES_PATH=$PACKAGES_PATH"
          # 逐项确认 EDK2 能找到包（DarwinBootPkg 在 UniXNU/drivers/DarwinBoot 下）
          for d in $UNIXNU_ROOT/package $UNIXNU_ROOT/drivers/DarwinBoot $MU_BASE; do
            ls -d "$d" || { echo "缺少 $d"; exit 1; }
          done
          ls "$UNIXNU_ROOT/drivers/DarwinBoot/DarwinBootPkg/Driver/DarwinBoot.inf"

          cd "$UES"
          # 板级补丁（GIC spurious），仅编译期应用
          if [ -f "$UES/Resources/MuPatches/Gic-Spurious.patch" ]; then
            git -C "$MU_BASE" apply --check "$UES/Resources/MuPatches/Gic-Spurious.patch" \
              && git -C "$MU_BASE" apply "$UES/Resources/MuPatches/Gic-Spurious.patch" \
              || echo "Gic-Spurious 补丁未应用（可能已包含）"
          fi

          DEVICE="${{ github.event.inputs.device || 'sheng' }}"
          echo "编译设备: $DEVICE"
          build -p "Platforms/Xiaomi/${DEVICE}Pkg/${DEVICE}.dsc" \
                -a AARCH64 -b DEBUG -t CLANGPDB -n "$(nproc)" \
                -D FD_BASE=0xA7100000 -D FD_SIZE=0x300000 -D FD_BLOCKS=768 \
                -D ENABLE_SECUREBOOT=1 -D DEVICE_MODEL="$DEVICE" \
                -D MEMORY_PROTECTION=TRUE -D SHIP_MODE=FALSE \
                -D BUILDID_STRING="${DEVICE}-research" 2>&1 | tee build.log

          echo "---- 产物 ----"
          find Build -name "*.fd" | head -20

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uefi-sheng-fd
          path: |
            UniXNU-sheng/uefi-sheng/Build/**/*.fd
            uefi-sheng/Build/**/*.fd
            UniXNU-sheng/uefi-sheng/build.log
            uefi-sheng/build.log
          if-no-files-found: warn
          retention-days: 14
