name: build-uefi-sheng

# 目标：验证 uefi-sheng (Mu-Silicium) 的构建链路能否在 CI 上跑通。
#
# 先只编 sheng（小米平板 6S Pro，SM8550，与我们的 fuxi 同 SoC）——
# 这一步不改任何参数，纯粹确认工具链、submodule、依赖都没问题。
# 通过之后再复制 shengPkg 改出 fuxiPkg。
#
# 产物：SILICIUM_UEFI.fd（UEFI 固件卷）

concurrency:
  group: uefi-sheng-${{ github.ref }}
  cancel-in-progress: true

on:
  # 推送 + 定时都能自动跑，不需要人工点 Run workflow
  push:
    paths:
      - "xnu/uefi/**"
      - ".github/workflows/build-uefi-sheng.yml"
  schedule:
    # 每 6 小时试一次，用于自动重试（Mu-Silicium 的 submodule 拉取偶发失败）
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      device:
        description: "要编译的设备（默认 sheng）"
        required: false
        default: "sheng"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # ── 缓存：把 ~5GB 的源码树整体缓存，第二次以后只做增量 ──
      - name: 恢复源码树缓存
        id: src-cache
        uses: actions/cache@v4
        with:
          path: uefi-sheng
          key: uefi-sheng-src-${{ hashFiles('.github/workflows/build-uefi-sheng.yml') }}

      - name: 克隆 uefi-sheng（缓存未命中时）
        if: steps.src-cache.outputs.cache-hit != 'true'
        run: |
          set -x
          # 注意：不能用 --depth 1。Mu 的 OverrideValidation 插件会用 git 取
          # 「变更文件列表」，浅克隆拿不到父提交 → filepath 为 None →
          # normpath(None) 崩溃。这里要完整克隆。
          for attempt in 1 2 3; do
            rm -rf uefi-sheng
            if git clone --recursive \
                 https://github.com/UniXNU/uefi-sheng.git uefi-sheng; then
              echo "克隆成功（第 $attempt 次）"
              break
            fi
            echo "克隆失败（第 $attempt 次），重试…"
            sleep 20
          done
          cd uefi-sheng
          git submodule update --init --recursive
          # 至少有两个提交，插件才能算出变更列表
          git log --oneline | head -5
          du -sh .
          ls

      # shengPkg/DeviceBuild.py 要求 UNIXNU_ROOT/package 存在（默认找 ../UniXNU/package）
      - name: 克隆 UniXNU 框架（固件构建需要它的 package）
        run: |
          set -x
          for attempt in 1 2 3; do
            if [ -d UniXNU/package ]; then
              echo "UniXNU 已存在"
              break
            fi
            rm -rf UniXNU
            if git clone --depth 1 https://github.com/UniXNU/UniXNU.git UniXNU; then
              echo "UniXNU 克隆成功（第 $attempt 次）"
              break
            fi
            echo "UniXNU 克隆失败（第 $attempt 次），重试…"
            sleep 15
          done
          ls -ld UniXNU/package
          du -sh UniXNU

      - name: 缓存命中确认
        if: steps.src-cache.outputs.cache-hit == 'true'
        run: |
          echo "源码树来自缓存，跳过克隆"
          du -sh uefi-sheng
          ls uefi-sheng | head

      # ── 缓存：EDK2 的 BaseTools 与 Build 输出 ──
      - name: 恢复构建输出缓存
        id: build-cache
        uses: actions/cache@v4
        with:
          path: |
            uefi-sheng/Build
            uefi-sheng/Conf
          key: uefi-sheng-build-${{ hashFiles('.github/workflows/build-uefi-sheng.yml') }}-${{ github.run_id }}
          restore-keys: |
            uefi-sheng-build-${{ hashFiles('.github/workflows/build-uefi-sheng.yml') }}-

      - name: 安装依赖
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y \
            build-essential uuid-dev iasl nasm python3 python3-pip \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            device-tree-compiler git-lfs

      - name: pip 依赖
        run: |
          set -x
          python3 -m pip install --upgrade pip
          if [ -f uefi-sheng/pip-requirements.txt ]; then
            python3 -m pip install -r uefi-sheng/pip-requirements.txt
          fi
          python3 -m pip install coloredlogs || true

      - name: 环境准备脚本
        run: |
          set -x
          cd uefi-sheng
          ls -l setup_env.sh 2>/dev/null || echo "没有 setup_env.sh"
          if [ -f setup_env.sh ]; then
            chmod +x setup_env.sh
            ./setup_env.sh -p apt || echo "setup_env 返回非零，继续"
          fi

      - name: 编译 UEFI
        env:
          # shengPkg 默认找 ../UniXNU，这里显式指到工作区根目录下的克隆
          UNIXNU_ROOT: ${{ github.workspace }}/UniXNU
        run: |
          set -x
          cd uefi-sheng
          DEVICE="${{ github.event.inputs.device || 'sheng' }}"
          echo "编译设备: $DEVICE"
          # 有构建缓存时不加 -c，让 EDK2 做增量编译（快得多）
          CLEAN_FLAG=""
          if [ "${{ steps.build-cache.outputs.cache-hit }}" != "true" ]; then
            CLEAN_FLAG="-c"
            echo "无构建缓存，全量编译"
          else
            echo "有构建缓存，增量编译"
          fi
          python3 build_uefi.py -d "$DEVICE" -r RELEASE $CLEAN_FLAG 2>&1 | tee build.log
          echo "---- 产物 ----"
          find Build -name "*.fd" | head -20 || true
          ls -lR Build/*/*/FV 2>/dev/null || true

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uefi-sheng-fd
          path: |
            uefi-sheng/Build/**/*.fd
            uefi-sheng/build.log
          if-no-files-found: warn
          retention-days: 14
