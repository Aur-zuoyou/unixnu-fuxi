name: build-fuxi-uefi

# 目标: 用 edk2-porting/edk2-msm 的源码, 给小米 13 (fuxi, SM8550) 编出 UEFI 固件。
#
# 背景: Renegade 项目从来没有发布过 fuxi 的镜像, 但源码里有
#       Platform/Xiaomi/sm8550/fuxi.dsc —— 所以可以自己编。
#
# 产物: boot-fuxi.img  (fastboot flash boot boot-fuxi.img)
#
# 注意: 这个镜像是我们自己编的, 没有经过任何真机验证。刷机前确认能回滚。

on:
  push:
    paths:
      - "loader/**"
      - ".github/workflows/build-fuxi-uefi.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 uuid-dev nasm acpica-tools \
            clang lld llvm gcc-aarch64-linux-gnu \
            device-tree-compiler libfdt-dev zlib1g-dev \
            gettext gperf pkg-config libssl-dev

      - name: 取 edk2-msm
        run: |
          set -euo pipefail
          set -x
          git clone --depth 1 https://github.com/edk2-porting/edk2-msm.git
          cd edk2-msm
          git log --oneline -1
          ls

      - name: 注入探针驱动
        run: |
          set -euo pipefail
          set -x
          # fuxi 这版固件没有输入驱动, 菜单/Shell 都操作不了。
          # 所以把探针编进固件, 由 BDS 自动加载, 不需要任何按键。
          probe=edk2-msm/Platform/Xiaomi/sm8550/probe
          mkdir -p "$probe"
          cp loader/Probe.c loader/Probe.inf "$probe"/

          # ① [Components] 必须插进"已有的"段里; 新追加一个段会被静默忽略。
          #    而且不能瞎 grep: 别的机型的 DSC 也有这个段。必须顺着 fuxi.dsc 的
          #    !include 链找, 否则插到无关文件里, build 会报 F001 NOT found in DSC。
          comp="$(python3 tools/find_components_file.py edk2-msm edk2-msm/Platform/Xiaomi/sm8550/fuxi.dsc || true)"
          echo "components file: [$comp]"
          if [ -z "$comp" ]; then
            echo "!! 沿 include 链没找到 [Components, 构建几乎肯定失败"
            exit 1
          fi
          # 用 Python 插入: sed 的 & 不含结尾的 ], 会把段头写坏
          python3 tools/patch_dsc.py "$comp" Platform/Xiaomi/sm8550/probe/Probe.inf
          echo "--- 确认 Components ---"
          grep -n -A5 -i '^\[components' "$comp" | head -12

          # ② FDF: sm8550.fdf 不使用 DEVICE_DXE_FV_COMPONENTS, 必须直接插进 [FV.FvMain]
          sed -i '/INF MdeModulePkg\/Universal\/BdsDxe\/BdsDxe.inf/a\  INF Platform/Xiaomi/sm8550/probe/Probe.inf' \
            edk2-msm/Platform/Qualcomm/sm8550/sm8550.fdf
          echo "--- 确认 FDF(探针) ---"
          grep -n "probe/Probe.inf" edk2-msm/Platform/Qualcomm/sm8550/sm8550.fdf

          # ③ 顺手补 USB 键盘驱动: 原列表里只有 UsbBus/UsbMouse/UsbMassStorage,
          #    没有 UsbKbDxe, 所以插 OTG 键盘也没反应。加上它, 插键盘就能选菜单。
          sed -i '/INF MdeModulePkg\/Bus\/Usb\/UsbMassStorageDxe\/UsbMassStorageDxe.inf/a\  INF MdeModulePkg/Bus/Usb/UsbKbDxe/UsbKbDxe.inf' \
            edk2-msm/Platform/Qualcomm/sm8550/sm8550.fdf
          echo "--- 确认 FDF(键盘) ---"
          grep -n "UsbKbDxe" edk2-msm/Platform/Qualcomm/sm8550/sm8550.fdf

      - name: 固件补丁：放宽 DxeCore 的 runtime 对齐检查
        run: |
          set -x
          # DxeCore 在 ExitBootServices 时要求 runtime 区按
          # RUNTIME_PAGE_ALLOCATION_GRANULARITY 对齐（EFI 允许 4K 或 64K）。
          # 实测我们所有 runtime 区都是 4K 对齐，但固件按更大粒度校验，导致退出失败。
          # 这是纯 sanity check，不改变实际内存布局，改宏即可。
          echo "### 宏定义位置"
          grep -rn "define RUNTIME_PAGE_ALLOCATION_GRANULARITY" edk2-msm/Common/edk2 2>/dev/null | head -5 || true
          echo "### 改之前的值"
          grep -rn "RUNTIME_PAGE_ALLOCATION_GRANULARITY" edk2-msm/Common/edk2/MdeModulePkg/Core/Dxe 2>/dev/null | head -10 || true
          for f in $(grep -rl "define RUNTIME_PAGE_ALLOCATION_GRANULARITY" edk2-msm/Common/edk2 2>/dev/null); do
            sed -i 's/#define RUNTIME_PAGE_ALLOCATION_GRANULARITY.*/#define RUNTIME_PAGE_ALLOCATION_GRANULARITY 1/' "$f"
            echo "patched: $f"
          done
          echo "### 改之后"
          grep -rn "define RUNTIME_PAGE_ALLOCATION_GRANULARITY" edk2-msm/Common/edk2 2>/dev/null | head -5 || true
          echo "### 所有引用该宏的位置"
          grep -rn "RUNTIME_PAGE_ALLOCATION_GRANULARITY" edk2-msm/Common/edk2 2>/dev/null | head -20 || true
      - name: 编 fuxi UEFI
        run: |
          set +e                    # 关键: GitHub 用 bash -e, 否则 build.sh 一失败就吞掉日志
          cd edk2-msm
          export CROSS_COMPILE=aarch64-linux-gnu-
          # 不要加 --skip-rootfs-gen: SimpleInitRootFS.inf 需要 build/rootfs.c
          ./build.sh -d fuxi -r RELEASE > build.log 2>&1
          rc=$?
          set -e
          echo "=== build.sh 退出码: $rc ==="
          tail -150 build.log
          cp build.log ../build.log
          exit $rc

      - name: 诊断（结果写进 diag.txt, 随 artifact 下载）
        if: always()
        run: |
          exec > >(tee edk2-msm/diag.txt) 2>&1
          echo "### date: $(date -u)"
          echo "### DEVICE_DXE_FV_COMPONENTS 出现在哪"
          grep -rn "DEVICE_DXE_FV_COMPONENTS" edk2-msm/Platform edk2-msm/Silicon 2>/dev/null | head -5 || true
          echo
          echo "### fuxi.fdf.inc 内容"
          cat edk2-msm/Platform/Xiaomi/sm8550/fuxi.fdf.inc || true
          echo
          echo "### sm8550.fdf 里的 FV / INF / 宏"
          grep -n "^\[\|INF \|DEVICE_DXE\|!include" edk2-msm/Platform/Qualcomm/sm8550/sm8550.fdf 2>/dev/null | head -60 || true
          echo
          echo "### sm8550.fdf 前 80 行"
          head -80 edk2-msm/Platform/Qualcomm/sm8550/sm8550.fdf 2>/dev/null || true
          echo
          echo "### fuxi.dsc 尾部（我们追加的 [Components]）"
          tail -12 edk2-msm/Platform/Xiaomi/sm8550/fuxi.dsc || true
          echo
          echo "### 所有含 [Components 的文件"
          grep -rln '^\[Components' edk2-msm/Platform edk2-msm/Silicon 2>/dev/null | head -10 || true
          echo
          echo "### 所有引用了 probe/Probe.inf 的位置"
          grep -rn "probe/Probe.inf" edk2-msm/Platform edk2-msm/Silicon 2>/dev/null | head -10 || true
          echo
          echo "### build.log 里与 probe 相关的行"
          grep -in "probe" build.log 2>/dev/null | head -25 || true
          echo
          echo "### build.log 里与 Components 相关的行"
          grep -in "Component" build.log 2>/dev/null | head -15 || true
          echo
          echo "### 生成产物列表"
          find edk2-msm -maxdepth 5 \( -name "*.Fv" -o -name "*.fv" -o -name "*.fd" -o -name "*.img" \) 2>/dev/null | head -30 || true
          echo
          echo "### 编译输出里有没有 FuxiProbe"
          find edk2-msm/Build -iname "*FuxiProbe*" 2>/dev/null | head -10 || true
          ls -l edk2-msm/Build/*/*/AARCH64/ 2>/dev/null | head -10 || true
          echo
          echo
          echo "### 源码里出现 EFI_MEMORY_RUNTIME 的文件"
          grep -rln "EFI_MEMORY_RUNTIME" edk2-msm/Silicon edk2-msm/Platform 2>/dev/null | head -20 || true
          echo
          echo "### EFI_MEMORY_RUNTIME 的具体用法(前 40 条)"
          grep -rn "EFI_MEMORY_RUNTIME" edk2-msm/Silicon edk2-msm/Platform 2>/dev/null | head -40 || true
          echo
          echo "### 内存图/属性表相关文件"
          find edk2-msm/Silicon edk2-msm/Platform -iname "*MemoryMap*" -o -iname "*MemoryAttribute*" -o -iname "*MemMap*" 2>/dev/null | head -20 || true
          echo
          echo "### 可疑的非页对齐常量(0x8F0xxxx 之类)"
          grep -rn "0x8F0\|0x8F09\|0x8F03" edk2-msm/Silicon edk2-msm/Platform 2>/dev/null | head -20 || true
          echo
          echo
          echo "### 报错原文出自哪个文件"
          grep -rn "proper alignment" edk2-msm 2>/dev/null | head -10 || true
          echo
          echo "### DxeCore CoreTerminateMemoryMap 的完整逻辑"
          pc=edk2-msm/Common/edk2/MdeModulePkg/Core/Dxe/Mem/Page.c
          if [ -f "$pc" ]; then
            n=$(grep -n "proper alignment" "$pc" | head -1 | cut -d: -f1)
            s=$((n-70)); [ $s -lt 1 ] && s=1
            echo "--- Page.c 第 $s 行到 $((n+15)) 行 ---"
            sed -n "${s},$((n+15))p" "$pc"
          fi
          echo
          echo "### boot-fuxi.img 里找探针 GUID"
          python3 tools/find_probe.py edk2-msm/boot-fuxi.img || true
          echo
          echo "### diag 结束"

      - name: 检查产物
        run: |
          ls -lh edk2-msm/*.img || true
          test -f edk2-msm/boot-fuxi.img
          ls -l edk2-msm/boot-fuxi.img edk2-msm/diag.txt

      - name: 上传
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-uefi
          path: |
            edk2-msm/boot-fuxi.img
            edk2-msm/uefi-fuxi*.img
            edk2-msm/diag.txt
            build.log
          if-no-files-found: error
